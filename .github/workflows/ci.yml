name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  # Gate: сборка Release + полный selftest (exit code 0/1) — тот же прогон, что и локально
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x
      - run: dotnet build -c Release src/SmartEdit.Mcp/SmartEdit.Mcp.csproj
      - run: dotnet run -c Release --no-build --project src/SmartEdit.Mcp/SmartEdit.Mcp.csproj -- selftest

  # По тегу v*: publish (framework-dependent + self-contained) + zips + draft release (публикует человек)
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x
      - run: dotnet publish -c Release -r win-x64 -o win-x64/publish src/SmartEdit.Mcp/SmartEdit.Mcp.csproj
      - run: dotnet publish -c Release -r win-x64 -p:SelfContained=true -o win-x64/publish-sc src/SmartEdit.Mcp/SmartEdit.Mcp.csproj
      - name: selftest gate on the self-contained binary
        run: win-x64/publish-sc/SmartEdit.Mcp.exe selftest
      - name: zip assets
        run: |
          $tag = $env:GITHUB_REF_NAME
          Compress-Archive -Path win-x64/publish/SmartEdit.Mcp.exe -DestinationPath "win-x64/SmartEdit-win-x64-$tag.zip" -Force
          Compress-Archive -Path win-x64/publish-sc/SmartEdit.Mcp.exe -DestinationPath "win-x64/SmartEdit-sc-win-x64-$tag.zip" -Force
          Get-Item win-x64/*.zip
      - name: draft release with assets
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release create $tag --draft --generate-notes "win-x64/SmartEdit-win-x64-$tag.zip" "win-x64/SmartEdit-sc-win-x64-$tag.zip"
        env:
          GH_TOKEN: ${{ github.token }}

  # AOT-эксперимент (#7): линкер MSVC есть на runner'е — пробуем собрать и прогнать selftest.
  # Не блокирует релиз; зелёный результат = прикрепим ассетом в следующей итерации.
  aot-experiment:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x
      - run: dotnet publish -c Release -r win-x64 -p:PublishAot=true -o win-x64/publish-aot src/SmartEdit.Mcp/SmartEdit.Mcp.csproj
      - run: win-x64/publish-aot/SmartEdit.Mcp.exe selftest
