name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  # Gate: сборка Release + полный selftest (exit code 0/1) — тот же прогон, что и локально
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x
      - run: dotnet build -c Release src/SmartEdit.Mcp/SmartEdit.Mcp.csproj
      - run: dotnet run -c Release --no-build --project src/SmartEdit.Mcp/SmartEdit.Mcp.csproj -- selftest

  # По тегу v*: publish + zip + draft release с ассетом (публикует человек после осмотра)
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x
      - run: dotnet publish -c Release -r win-x64 -o win-x64/publish src/SmartEdit.Mcp/SmartEdit.Mcp.csproj
      - name: zip asset
        run: |
          $zip = "win-x64/SmartEdit-win-x64-$env:GITHUB_REF_NAME.zip"
          Compress-Archive -Path win-x64/publish/SmartEdit.Mcp.exe -DestinationPath $zip -Force
          Get-Item $zip
      - name: draft release with asset
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release create $tag --draft --generate-notes "win-x64/SmartEdit-win-x64-$tag.zip"
        env:
          GH_TOKEN: ${{ github.token }}
